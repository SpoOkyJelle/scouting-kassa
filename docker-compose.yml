# Production stack for the VPS: Caddy (auto-HTTPS reverse proxy) → Node app → Postgres.
# Copy .env.example to .env and fill it in, then: docker compose up -d --build
# Run migrations once the stack is up:  docker compose exec app npm run migrate

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kassa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kassa}
      POSTGRES_DB: kassa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kassa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://kassa:${POSTGRES_PASSWORD:-kassa}@db:5432/kassa
      SESSION_SECRET: ${SESSION_SECRET}
      # Still required while server.js runs the single-tenant SQLite app:
      PIN: ${PIN}
      CASHIER_PIN: ${CASHIER_PIN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
